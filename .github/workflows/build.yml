name: Build Executables

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Build executable (windowed, no console)
        run: pyinstaller --onefile --windowed --name rename_images rename_images.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rename-images-windows
          path: dist/rename_images.exe

  build-mac:
    runs-on: macos-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Build app bundle (windowed, no terminal)
        run: pyinstaller --onefile --windowed --name RenameImages rename_images.py

      - name: Zip the app bundle (preserves permissions)
        run: |
          cd dist
          ditto -c -k --sequesterRsrc --keepParent RenameImages.app RenameImages-mac.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rename-images-mac
          path: dist/RenameImages-mac.zip

  release:
    needs: [build-windows, build-mac]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Create GitHub Release with binaries attached
        uses: softprops/action-gh-release@v2
        with:
          files: |
            rename-images-windows/rename_images.exe
            rename-images-mac/RenameImages-mac.zip
