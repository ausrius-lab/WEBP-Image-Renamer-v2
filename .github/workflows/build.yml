name: Build Executables

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            build_name: rename_images.exe
            artifact_name: rename-images-windows
          - os: macos-latest
            build_name: rename_images
            artifact_name: rename-images-mac
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: List repo contents (debug)
        run: ls -la

      - name: Build executable
        run: pyinstaller --onefile --name rename_images rename_images.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/${{ matrix.build_name }}

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Create GitHub Release with binaries attached
        uses: softprops/action-gh-release@v2
        with:
          files: |
            rename-images-windows/rename_images.exe
            rename-images-mac/rename_images
